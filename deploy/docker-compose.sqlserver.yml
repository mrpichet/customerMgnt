# =====================================================================================
# ใช้ SQL Server 2022 แทน PostgreSQL (override ของ docker-compose.yml)
#   ./deploy/generate-secrets.sh
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.sqlserver.yml up -d --build
# - sqlserver-init สร้างฐานข้อมูล + login เฉพาะของแอป (ไม่ใช้ sa ในแอป) แล้วจบ
# - SQL Server ต้องเขียน /var/opt/mssql จึงไม่ใช้ read_only rootfs แต่ยัง cap_drop ALL / no-new-privileges / non-root (uid 10001)
# - Developer edition ใช้ทดสอบเท่านั้น: production ตั้ง MSSQL_PID ให้ตรงกับ license ที่ซื้อ
# =====================================================================================
x-mssql: &mssql
  image: mcr.microsoft.com/mssql/server:2022-latest
  cap_drop: [ALL]
  cap_add: [NET_BIND_SERVICE]   # sqlservr มี file capability นี้ — ถ้าไม่อยู่ใน bounding set จะ exec ไม่ได้
  security_opt: ["no-new-privileges:true"]
  networks: [backend]
  group_add: ["${SECRETS_GID:?run deploy/generate-secrets.sh first}"]   # อ่านไฟล์ secret (640) ได้ในฐานะ uid 10001
  secrets: [mssql_sa_password, mssql_app_password]

services:
  customermgnt-api:
    environment:
      Database__Provider: SqlServer
    secrets:
      - source: db_connection_sqlserver
        target: Database__ConnectionString
    depends_on: !override
      sqlserver-init: { condition: service_completed_successfully }

  postgres:
    profiles: [postgres]   # ไม่เริ่ม PostgreSQL เมื่อใช้ไฟล์นี้

  sqlserver:
    <<: *mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
    # รหัส sa อ่านจาก secret ตอนเริ่ม (ไม่อยู่ใน env ของ compose/image)
    entrypoint: ["/bin/bash", "-c", "export MSSQL_SA_PASSWORD=\"$$(cat /run/secrets/mssql_sa_password)\"; exec /opt/mssql/bin/sqlservr"]
    tmpfs: ["/tmp"]
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$(cat /run/secrets/mssql_sa_password)\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G, pids: 512 }

  sqlserver-init:
    <<: *mssql
    restart: "no"
    read_only: true
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M, pids: 64 }
    depends_on:
      sqlserver: { condition: service_healthy }
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        APP_PW="$$(cat /run/secrets/mssql_app_password)"
        /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P "$$(cat /run/secrets/mssql_sa_password)" -v AppPw="$$APP_PW" -Q "
          IF DB_ID('customermgnt') IS NULL CREATE DATABASE customermgnt;
          IF SUSER_ID('customermgnt') IS NULL CREATE LOGIN customermgnt WITH PASSWORD = '\$$(AppPw)', CHECK_POLICY = ON;
          ELSE ALTER LOGIN customermgnt WITH PASSWORD = '\$$(AppPw)';"
        /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P "$$(cat /run/secrets/mssql_sa_password)" -d customermgnt -Q "
          IF USER_ID('customermgnt') IS NULL CREATE USER customermgnt FOR LOGIN customermgnt;
          ALTER ROLE db_owner ADD MEMBER customermgnt;"
        echo "customermgnt database ready"

volumes:
  mssql-data:

secrets:
  db_connection_sqlserver: { file: ./secrets/db_connection_sqlserver.txt }
  mssql_sa_password:       { file: ./secrets/mssql_sa_password.txt }
  mssql_app_password:      { file: ./secrets/mssql_app_password.txt }
